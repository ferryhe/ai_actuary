name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Assert default dev excludes Google ADK
        run: |
          python - <<'PY'
          import importlib.util

          try:
              spec = importlib.util.find_spec("google.adk")
          except ModuleNotFoundError:
              spec = None
          assert spec is None, "google.adk must not be installed by .[dev]"
          PY

      - name: Run tests
        run: python -m pytest -q

  adk-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ADK developer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,adk-dev]"

      - name: Verify pinned ADK and developer agent
        run: |
          adk --version
          python -c "from developer_workflows.ai_actuary_developer import root_agent; assert root_agent.name == 'ai_actuary_developer'"

      - name: Run ADK foundation and Phase 3 tool tests
        run: python -m pytest tests/test_adk_developer_foundation.py tests/test_operator_console_assets.py tests/test_adk_run_tools.py tests/test_adk_workflow_drafts.py tests/test_adk_workflow_policy.py tests/test_adk_trace_correlation.py tests/test_adk_evaluations.py -q

      - name: Smoke dual-interface launcher
        run: python scripts/run_local_workbench.py --smoke

  adk-model-free-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Phase 5 contract and offline evaluation tests
        run: python -m pytest tests/test_adk_trace_correlation.py tests/test_adk_evaluations.py -q

      - name: Record offline evaluation evidence
        run: python -m reserving_workflow.evaluation.adk_lanes --lane offline --state-root tmp/adk-offline-eval

  adk-real-model-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Record real-model evaluation evidence
        run: python -m reserving_workflow.evaluation.adk_lanes --lane real-model --state-root tmp/adk-real-model-eval

      - name: Verify real-model evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence_files = list(Path("tmp/adk-real-model-eval").glob("*/evidence.json"))
          assert len(evidence_files) == 1
          evidence = json.loads(evidence_files[0].read_text(encoding="utf-8"))
          assert evidence["lane"] == "real_model"
          assert evidence["status"] in {"skipped", "completed"}
          assert evidence.get("ok") is not False
          if evidence["status"] == "skipped":
              assert "not_run_reason" in evidence
          assert "config_summary" in evidence
          assert "code_sha" in evidence
          PY

  adk-workflow-lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Workflow Lab dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,adk-dev]"

      - name: Run cross-platform Workflow Lab security suite
        run: python -m pytest tests/test_adk_workflow_drafts.py tests/test_adk_workflow_policy.py -q

      - name: Build wheel and verify installed package resources
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv wheel-check
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          wheel-check/bin/python -m pip install "${wheel_path}[adk-dev]"
          wheel-check/bin/python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from reserving_workflow.adapters.adk.workflow_lab import WorkflowLab

          with TemporaryDirectory() as state:
              root = WorkflowLab.for_installed_runtime(Path(state)).materialize_published_workflows()
              assert (root / "workflow_lab_example" / "root_agent.yaml").is_file()
              try:
                  WorkflowLab.for_installed_runtime(Path(state)).export("workflow_lab_example")
              except Exception as exc:
                  assert getattr(exc, "code", None) == "source_checkout_required"
              else:
                  raise AssertionError("installed mode must not expose Git export")
          PY
        if: runner.os == 'Linux'
