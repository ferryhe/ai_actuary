[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-actuary"
version = "0.1.0"
description = "AI Actuary project skeleton with CAS Core, OpenAI Planner, and Hermes Workers"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "chainladder>=0.9,<1",
  "openai-agents>=0.2,<1",
  "polars>=1.40,<2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "pytest>=8,<9",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
adk-dev = [
  "google-adk==2.7.1; python_version == '3.11'",
]
browser-smoke = [
  "playwright==1.59.0",
]

[project.scripts]
ai-actuary-cleanup = "reserving_workflow.runtime.cleanup:main"
ai-actuary-package-audit = "reserving_workflow.runtime.package_audit:main"
ai-actuary-workbench = "reserving_workflow.cli.local_workbench:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["reserving_workflow*", "developer_workflows*", "workflows"]

[tool.setuptools.package-data]
"reserving_workflow.interfaces.operator_console" = ["console.html"]
"reserving_workflow.adapters.adk" = ["data/*.json"]
"reserving_workflow.developer_workflows" = ["**/*.yaml"]
"workflows" = ["agent-runtimes/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
